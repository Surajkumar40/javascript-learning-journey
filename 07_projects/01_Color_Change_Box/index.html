<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
    margin: 40px;
    padding: 0;
    /* background-color: bisque; */
}

.box{
    /* background-color: yellow; */
    display: flex;
    align-items: center;
    justify-content: center;
    border: 4px solid black;
    width: 90%;
}


.boxes{
    height: 280px;
    width: 200px;
    border: 2px solid black;
}
.box1{
    background-color: rgb(215, 242, 175);

}
.box2{
background-color: rgb(232, 232, 146);
}
.box3{
background-color: #ebadad;
}
.box4{
background-color: #555151;
}
.box5{
background-color: rgb(92, 80, 31);
}
    </style>
</head>

<body>
    <div class="box">
        <div class="box1 boxes"></div>
        <div class="box2 boxes"></div>
        <div class="box3 boxes"></div>
        <div class="box4 boxes"></div>
        <div class="box5 boxes"></div>
    </div>


    <script>
        const boxes = document.querySelectorAll(".boxes");

boxes.forEach(boxes => {
    boxes.addEventListener("click", () =>{
        const color =window.getComputedStyle(boxes).backgroundColor;

        document.body.style.backgroundColor = color;
    });
});
    </script>
</body>

</html>
